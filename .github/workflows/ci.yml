name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RB_SYS_CARGO_PROFILE: 'release'
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'
  RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
  # Cargo resolves a relative CARGO_TARGET_DIR against the CWD, and every
  # cargo invocation in rakelib/cargo.rake runs with chdir: 'ext/ssr_deno'.
  # This default therefore resolves to ext/ssr_deno/tmp/cargo-target, while
  # `rake compile` writes the absolute workspace-root path below (rb-sys
  # passes --target-dir explicitly).
  #
  # That split only matters for jobs that run both. `rust-checks` overrides
  # CARGO_TARGET_DIR to the absolute path so its tree is a single cacheable
  # directory; the matrix legs only run `rake compile`, so they only ever
  # touch the absolute one. `msrv` is the remaining exception: it runs both,
  # so its cargo:test steps still build into the uncached relative path —
  # a time cost, not a correctness one. See plans/ci-cache-budget.md.
  CARGO_TARGET_DIR: tmp/cargo-target
  RB_SYS_CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/cargo-target
  # Incremental artifacts are for iterative local rebuilds; across CI runs they
  # are dead weight in the cache (1.7GB of a 21GB dev tree locally). Release
  # already disables incremental; this covers the dev builds in rust-checks
  # and msrv.
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-test:
    runs-on: ${{ matrix.platform.runner }}
    name: CI (${{ matrix.platform.arch }}) - ${{ matrix.ruby }}
    # Legs ran ~13-18m warm-cache while they also carried the Rust checks;
    # those moved to the `rust-checks` job, so expect less. The timeout exists
    # because no job in this file had one — a genuine hang (e.g. a runtime
    # deadlock in the render path) would've silently sat for the GitHub
    # default of 6h. Kept at the msrv job's 45m for one consistent number.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
        platform:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64  }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            mold \
            pkg-config \
            libclang-dev
      # Restore/save are split, and only `main` saves. A pull_request run can
      # read main's entries but writes into refs/pull/<N>/merge, a scope
      # nothing else can ever read — so every open PR used to duplicate the
      # whole ~5.6GB cargo cache set against the repo's fixed 10GB cap, and
      # those writes evicted main's live entries. Reads still keep main's
      # entries hot, because eviction is by last access.
      #
      # Trade-off: a PR leg has no fallback of its own. If main's entry is
      # evicted, every push to that PR pays a cold build (~24m measured, inside
      # the 45m timeout) until main repopulates. Slower, not broken — and
      # strictly better than the old behaviour, where the PR's own writes were
      # what evicted main's entries in the first place.
      - name: Restore Cargo registry + git deps
        id: cargo-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-deps-
      - name: Restore Cargo build artifacts (target dir)
        id: cargo-target
        uses: actions/cache/restore@v6
        with:
          path: tmp/cargo-target
          # No matrix.ruby component: the bulk of this tree is
          # release/gn_out/obj/librusty_v8.a plus the Deno dependency graph,
          # which is byte-identical across Ruby versions. Six entries were two
          # payloads stored three times each.
          #
          # Only the canonical leg saves (see the save step), so a tree built
          # against one Ruby ABI never accumulates artifacts from another.
          # Non-canonical legs restore it and rebuild just their own chain:
          # rb-sys re-runs because it declares RBCONFIG_* via
          # cargo:rerun-if-env-changed, which regenerates the bindings and
          # relinks magnus and the cdylib. A wrong-ABI .so would fail loudly at
          # `require` in `rake test`, not silently.
          #
          # No source-file hash either, deliberately — do not add one back.
          # actions/cache only skips saving on an exact primary-key hit, so a
          # key ending in hashFiles('**/*.rs') minted a whole new ~4GB
          # generation on every Rust-touching merge while the old one lingered,
          # which is what kept pushing the repo over the 10GB cap. Keyed on the
          # rustc version and Cargo.lock, it rotates only when the dependency
          # graph or toolchain actually changes. The trade is that the entry
          # never refreshes within a generation, so the four workspace crates
          # rebuild from a fixed dependency base — they already rebuild on
          # every leg of every run, so that costs nothing new.
          # See plans/ci-cache-budget.md.
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile native extension
        run: bundle exec rake compile
      # Saved here rather than as a post-job step on purpose: nothing after
      # this point writes the cached directory — this job only runs `rake
      # compile`, which writes the absolute RB_SYS_CARGO_TARGET_DIR. So
      # everything worth caching already exists here, and a later test failure
      # still leaves the build artifacts cached.
      #
      # One canonical Ruby per arch writes the shared entry. Letting all three
      # write would not race — the loser just warns "cache already exists" —
      # but it would make *which* ABI's artifacts are in the tree depend on
      # which leg finished first. A fixed writer keeps that deterministic.
      #
      # `cache-hit` is true only on an exact primary-key match, which is
      # exactly when saving would be a no-op warning.
      - name: Save Cargo build artifacts (target dir)
        if: github.ref == 'refs/heads/main' && matrix.ruby == '4.0' && steps.cargo-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tmp/cargo-target
          key: ${{ steps.cargo-target.outputs.cache-primary-key }}
      - name: Save Cargo registry + git deps
        if: github.ref == 'refs/heads/main' && steps.cargo-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-deps.outputs.cache-primary-key }}
      - name: Build SSR sample bundles
        run: bundle exec rake samples:build
      - name: Run tests
        run: bundle exec rake test
      # Coverage doesn't vary by Ruby version, but a documented upstream
      # Coverage/GC race does (bugs.ruby-lang.org #22179, #22187): any GC
      # pass during the run can zero out real hit counts for
      # already-executed lines. Confirmed locally (~50% flake rate on
      # 3.4.10 in complete isolation; GC.disable eliminates it, proving
      # the mechanism — but disabling GC across the whole test process
      # would defeat test_deno_stability.rb's own leak-detection purpose).
      # 3.3 and 4.0 hit the same race in real CI runs too, just at lower
      # odds — checking multiple versions only multiplies the chance of
      # a flaky failure with zero extra signal, since it's the same code.
      # Run on one canonical version only.
      - name: Check coverage
        if: matrix.ruby == '4.0'
        run: bundle exec rake coverage:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.platform.arch }}-${{ matrix.ruby }}
          path: coverage/
          include-hidden-files: true
          retention-days: 7
      # `perf:check` is deliberately absent from this workflow, so no job here
      # is the full `bundle exec rake` default chain. The perf suite compares
      # single-bundle against RactorPool throughput ratios with pool=4; shared
      # GitHub runners have too few vCPUs and too much neighbour noise for
      # those ratios to mean anything. It stays a local pre-release gate.

  # Everything that does not vary with the Ruby version. Running these on all
  # six legs meant six copies of an identical result — and, because the cargo
  # tasks build into an uncached directory (see the CARGO_TARGET_DIR note in
  # `env:`), six full cold builds of the Deno/V8 workspace per run, discarded
  # each time. This job pays that once, into a cache that actually persists.
  #
  # CARGO_TARGET_DIR is absolute here, unlike the workflow default: with every
  # cargo task confined to this job there is no longer a reason to split the
  # tree, and one cached dev tree is what makes these steps warm.
  rust-checks:
    runs-on: ubuntu-latest
    name: Rust checks
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/cargo-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            mold \
            pkg-config \
            libclang-dev
      - name: Restore Cargo registry + git deps
        id: cargo-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-deps-
      - name: Restore Cargo build artifacts (target dir)
        id: cargo-target
        uses: actions/cache/restore@v6
        with:
          path: tmp/cargo-target
          # Keyed on rustc + Cargo.lock, no source hash — see the matrix
          # job's key for the rationale.
          key: cargo-target-checks-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-target-checks-${{ steps.rust.outputs.cachekey }}-
            cargo-target-checks-
      # After the restores, not before: this downloads and builds a dependency
      # graph, so it wants the warm registry. CARGO_TARGET_DIR is overridden to
      # a scratch dir because `cargo install` honours it — otherwise
      # cargo-llvm-cov's artifacts land in the saved target entry.
      - name: Install Rust coverage tools
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-llvm-cov-install
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov
      - name: Check Rust formatting
        run: bundle exec rake cargo:fmt
      - name: Run Clippy
        run: bundle exec rake cargo:clippy
      - name: Run Rust unit tests (V8-free crates)
        run: bundle exec rake cargo:test
      - name: Run Rust unit tests (ssr_deno_dev_mode)
        run: bundle exec rake cargo:test:ssr_deno_dev_mode
      - name: Run Rust unit tests (ssr_deno)
        run: bundle exec rake cargo:test:ssr_deno
      - name: Run Rust coverage (cargo-llvm-cov)
        run: bundle exec rake cargo:coverage
      # Telemetry, not a gate. sccache costs ~2.5GB of the 10GB cache cap and
      # thousands of entries, and the only hit-rate figure on record (~18%,
      # plans/archived/ci-speedup.md) predates the job split — it was largely
      # serving a cold shadow build that no longer exists. This job is now the
      # only one doing heavy compilation, so its numbers decide whether
      # sccache still earns its keep. See plans/ci-cache-budget.md (L1).
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      # cargo llvm-cov writes an instrumented sibling tree that is worthless to
      # restore — different rustc flags, so it shares nothing with the builds
      # above. Dropped before the cache is saved.
      # always(): these sit after the checks, so without it a clippy or test
      # failure on main would throw away a perfectly good build tree and make
      # the next run rebuild from cold. The matrix job avoids this by saving
      # immediately after compile; here the tree is only complete at the end.
      - name: Prune uncacheable artifacts
        if: always() && github.ref == 'refs/heads/main'
        run: rm -rf tmp/cargo-target/llvm-cov-target
      - name: Save Cargo build artifacts (target dir)
        if: always() && github.ref == 'refs/heads/main' && steps.cargo-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tmp/cargo-target
          key: ${{ steps.cargo-target.outputs.cache-primary-key }}
      - name: Save Cargo registry + git deps
        if: always() && github.ref == 'refs/heads/main' && steps.cargo-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-deps.outputs.cache-primary-key }}

  # Pure static analysis of lib/ and sig/ — no compiled extension, no Rust
  # toolchain, no cargo cache. Splitting it out keeps a lint failure from
  # waiting on a V8 build.
  lint:
    runs-on: ubuntu-latest
    name: Lint (RuboCop, RBS)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rake rubocop
      - name: Run RuboCop (Rails)
        run: bundle exec rake rubocop:rails
      - name: Validate RBS signatures
        run: bundle exec rake rbs

  msrv:
    runs-on: ubuntu-latest
    name: MSRV (1.95.0)
    # First cold-cache run took 30m43s (own cache prefix, no sccache hits
    # since it doesn't share the floating-stable jobs' compiler). Warm runs
    # should land closer to the main legs' ~15m; 45m covers a repeat cold
    # run without leaving a genuine hang undetected for hours.
    timeout-minutes: 45
    # Verifies the `rust-version` declared in ext/ssr_deno/Cargo.toml's
    # [workspace.package] continuously — a declared floor that CI never
    # builds against is just a comment. Every other job floats
    # dtolnay/rust-toolchain@stable; this one pins the exact floor so a
    # future dep bump that silently raises the real requirement (as
    # happened when establishing this floor — see the [workspace.package]
    # comment in Cargo.toml) fails here instead of going unnoticed. One
    # platform/Ruby combo is enough: this is a toolchain check, not a
    # Ruby-compatibility check.
    env:
      # This job answers "does rustc 1.95.0 accept the code", not "is the
      # backtrace readable", so [profile.dev]'s unpacked debug info is dead
      # weight in its cache entry. Measured: ~1.27GB → ~686MB. Set at job
      # level so `rake compile` and the cargo test steps share one
      # fingerprint — though only compile's output is actually cached here,
      # since the test steps build into the relative CARGO_TARGET_DIR.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Set up Rust (pinned MSRV)
        id: rust
        uses: dtolnay/rust-toolchain@1.95.0
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            mold \
            pkg-config \
            libclang-dev
      # Restore/save split, main-only save — same rationale as the matrix job.
      - name: Restore Cargo registry + git deps
        id: cargo-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-deps-
      - name: Restore Cargo build artifacts (target dir)
        id: cargo-target
        uses: actions/cache/restore@v6
        with:
          path: tmp/cargo-target
          # No os/arch component — this job is one fixed combination, so they'd
          # be constants. Its own prefix keeps it off the matrix legs' entries:
          # this one is a dev-profile tree built by a pinned toolchain. The
          # rustc component still earns its place: it rotates the entry the day
          # the pin moves, which is exactly when the tree stops being valid.
          # No source-file hash — see the matrix job's key for why.
          key: cargo-target-msrv-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-target-msrv-${{ steps.rust.outputs.cachekey }}-
            cargo-target-msrv-
      - name: Compile native extension
        # Override the workflow-wide `release` profile: this job checks
        # whether rustc 1.95.0 accepts the code, not release-build
        # performance. `dev` skips LTO/codegen-units=1, which matters a
        # lot here — this toolchain shares no sccache hits with the
        # floating-`stable` jobs once `stable` advances past 1.95.0.
        env:
          RB_SYS_CARGO_PROFILE: 'dev'
        run: bundle exec rake compile
      - name: Save Cargo build artifacts (target dir)
        if: github.ref == 'refs/heads/main' && steps.cargo-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tmp/cargo-target
          key: ${{ steps.cargo-target.outputs.cache-primary-key }}
      - name: Save Cargo registry + git deps
        if: github.ref == 'refs/heads/main' && steps.cargo-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-deps.outputs.cache-primary-key }}
      - name: Run Rust unit tests (V8-free crates)
        run: bundle exec rake cargo:test
      - name: Run Rust unit tests (ssr_deno_dev_mode)
        run: bundle exec rake cargo:test:ssr_deno_dev_mode
      - name: Run Rust unit tests (ssr_deno)
        run: bundle exec rake cargo:test:ssr_deno
