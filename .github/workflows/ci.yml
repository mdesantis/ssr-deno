name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RB_SYS_CARGO_PROFILE: 'release'
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'
  RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
  CARGO_TARGET_DIR: tmp/cargo-target
  RB_SYS_CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/cargo-target

jobs:
  build-and-test:
    runs-on: ${{ matrix.platform.runner }}
    name: CI (${{ matrix.platform.arch }}) - ${{ matrix.ruby }}
    # Legs run ~13-16m warm-cache. No job in this file had a timeout before
    # this — a genuine hang (e.g. a runtime deadlock in the render path)
    # would've silently sat for the GitHub default of 6h. Matches the msrv
    # job's 45m for one consistent number across the workflow.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
        platform:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64  }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            mold \
            pkg-config \
            libclang-dev
      - name: Install Rust coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov
      - name: Cache Cargo registry + git deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-deps-
      - name: Cache Cargo build artifacts (target dir)
        uses: actions/cache@v6
        with:
          path: tmp/cargo-target
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ruby }}-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}-${{ hashFiles('ext/ssr_deno/src/**/*.rs', 'ext/ssr_deno/crates/**/*.rs') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ruby }}-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}-
            cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ruby }}-
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile native extension
        run: bundle exec rake compile
      - name: Run Rust unit tests (V8-free crates)
        run: bundle exec rake cargo:test
      - name: Run Rust unit tests (ssr_deno_dev_mode)
        run: bundle exec rake cargo:test:ssr_deno_dev_mode
      - name: Run Rust unit tests (ssr_deno)
        run: bundle exec rake cargo:test:ssr_deno
      - name: Run Rust coverage (cargo-llvm-cov)
        run: bundle exec rake cargo:coverage
      - name: Run Clippy
        run: bundle exec rake cargo:clippy
      - name: Build SSR sample bundles
        run: bundle exec rake samples:build
      - name: Run tests
        run: bundle exec rake test
      # Coverage doesn't vary by Ruby version, but a documented upstream
      # Coverage/GC race does (bugs.ruby-lang.org #22179, #22187): any GC
      # pass during the run can zero out real hit counts for
      # already-executed lines. Confirmed locally (~50% flake rate on
      # 3.4.10 in complete isolation; GC.disable eliminates it, proving
      # the mechanism — but disabling GC across the whole test process
      # would defeat test_deno_stability.rb's own leak-detection purpose).
      # 3.3 and 4.0 hit the same race in real CI runs too, just at lower
      # odds — checking multiple versions only multiplies the chance of
      # a flaky failure with zero extra signal, since it's the same code.
      # Run on one canonical version only.
      - name: Check coverage
        if: matrix.ruby == '4.0'
        run: bundle exec rake coverage:check
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.platform.arch }}-${{ matrix.ruby }}
          path: coverage/
          include-hidden-files: true
          retention-days: 7
      - name: Check Rust formatting
        run: bundle exec rake cargo:fmt
      - name: Run RuboCop
        run: bundle exec rake rubocop
      - name: Run RuboCop (Rails)
        run: bundle exec rake rubocop:rails
      - name: Validate RBS signatures
        run: bundle exec rake rbs

  msrv:
    runs-on: ubuntu-latest
    name: MSRV (1.95.0)
    # First cold-cache run took 30m43s (own cache prefix, no sccache hits
    # since it doesn't share the floating-stable jobs' compiler). Warm runs
    # should land closer to the main legs' ~15m; 45m covers a repeat cold
    # run without leaving a genuine hang undetected for hours.
    timeout-minutes: 45
    # Verifies the `rust-version` declared in ext/ssr_deno/Cargo.toml's
    # [workspace.package] continuously — a declared floor that CI never
    # builds against is just a comment. Every other job floats
    # dtolnay/rust-toolchain@stable; this one pins the exact floor so a
    # future dep bump that silently raises the real requirement (as
    # happened when establishing this floor — see the [workspace.package]
    # comment in Cargo.toml) fails here instead of going unnoticed. One
    # platform/Ruby combo is enough: this is a toolchain check, not a
    # Ruby-compatibility check.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Set up Rust (pinned MSRV)
        uses: dtolnay/rust-toolchain@1.95.0
      - uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            mold \
            pkg-config \
            libclang-dev
      - name: Cache Cargo registry + git deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}
          restore-keys: |
            cargo-deps-
      - name: Cache Cargo build artifacts (target dir)
        uses: actions/cache@v6
        with:
          path: tmp/cargo-target
          key: cargo-target-msrv-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}-${{ hashFiles('ext/ssr_deno/src/**/*.rs', 'ext/ssr_deno/crates/**/*.rs') }}
          restore-keys: |
            cargo-target-msrv-${{ hashFiles('ext/ssr_deno/Cargo.lock') }}-
            cargo-target-msrv-
      - name: Compile native extension
        # Override the workflow-wide `release` profile: this job checks
        # whether rustc 1.95.0 accepts the code, not release-build
        # performance. `dev` skips LTO/codegen-units=1, which matters a
        # lot here — this toolchain shares no sccache hits with the
        # floating-`stable` jobs once `stable` advances past 1.95.0.
        env:
          RB_SYS_CARGO_PROFILE: 'dev'
        run: bundle exec rake compile
      - name: Run Rust unit tests (V8-free crates)
        run: bundle exec rake cargo:test
      - name: Run Rust unit tests (ssr_deno_dev_mode)
        run: bundle exec rake cargo:test:ssr_deno_dev_mode
      - name: Run Rust unit tests (ssr_deno)
        run: bundle exec rake cargo:test:ssr_deno
