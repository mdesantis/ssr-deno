name: Cache cleanup

# Caches written by a workflow run triggered on a pull request are scoped to
# that PR's merge ref (refs/pull/<N>/merge) and can never be read by anything
# else — not the base branch, not other PRs (GitHub Actions cache access
# rules). Once a PR closes, every cache it wrote is permanently dead weight
# against the repo's fixed 10GB cache cap. This deletes it immediately
# instead of waiting on GitHub's own LRU eviction, which evicts globally and
# can otherwise end up evicting live caches on `main` first.
#
# ci.yml no longer writes cargo caches on PR refs (its cache steps are split
# into restore + a `main`-gated save), so the bulk of what this used to
# reclaim is gone. It remains the backstop for what still lands there:
# sccache's per-compilation-unit entries and setup-ruby's bundler cache.

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to clean caches for (for a manual/backfill run)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete this PR's merge-ref caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          ref="refs/pull/${PR_NUMBER}/merge"

          # A single `gh cache delete --all` is not enough. ci.yml sets
          # SCCACHE_GHA_ENABLED, and sccache's Actions backend writes one cache
          # entry per compilation unit rather than one per job, so a full CI
          # run leaves thousands of entries on the merge ref. gh deletes them
          # one REST call at a time and trips GitHub's secondary rate limit
          # partway through (HTTP 429), exiting non-zero with most of them
          # still present — which is how PR #7 finished "cleaned up" with 684
          # caches left behind.
          #
          # So: re-check the real count, retry, and back off between passes.
          # A transient API failure must not abort the step under `bash -e`,
          # and an empty value would break the numeric test below.
          count_caches() {
            local n
            n=$(gh api "repos/${GH_REPO}/actions/caches?ref=${ref}&per_page=1" --jq '.total_count' 2>/dev/null || true)

            case "$n" in
              '' | *[!0-9]*) echo -1 ;;
              *) echo "$n" ;;
            esac
          }

          for attempt in $(seq 1 12); do
            remaining=$(count_caches)

            echo "pass ${attempt}: ${remaining} cache(s) on ${ref}"

            if [ "$remaining" -eq 0 ]; then
              echo "All caches for ${ref} deleted."
              exit 0
            fi

            gh cache delete --all --ref "$ref" --succeed-on-no-caches || true

            sleep 20
          done

          # Deliberately not a failure. Partial progress still reclaims most of
          # the space, GitHub's LRU takes the rest, and a red X on every merge
          # is noise people learn to ignore.
          echo "::warning::$(count_caches) cache(s) still on ${ref} after 12 passes; leaving the rest to LRU eviction."
