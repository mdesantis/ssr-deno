[package]
name = "ssr_deno_dev_mode"
version = "0.1.0-alpha.9"
edition.workspace = true
rust-version.workspace = true

[dependencies]
deno_runtime = { version = "0.265.0", features = ["hmr"] }
deno_core = "=0.410.0"
deno_error = "=0.7.1"
deno_resolver = { version = "=0.88.0", features = ["deno_ast"] }
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
node_resolver = "=0.95.0"
deno_semver = "=0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
magnus = { version = "0.8", features = ["embed"] }
ssr_deno_core = { path = "../ssr_deno_core" }
ssr_deno_sys = { path = "../ssr_deno_sys" }
