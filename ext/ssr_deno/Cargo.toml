[workspace]
resolver = "2"
members = [
    ".",
    "crates/ssr_deno_core",
    "crates/ssr_deno_sys",
    "crates/ssr_deno_dev_mode",
]

# MSRV verified empirically (see AGENTS.md "Rust edition/MSRV"): 1.85.0/
# 1.88.0/1.90.0/1.93.0/1.94.0 all fail on transitive deps (icu/time/home,
# deno_core's cppgc.rs const TypeId::of, libsqlite3-sys's cfg_select!).
# 1.95.0 is the first version where the whole workspace compiles.
# Re-verify after any dep bump.
[workspace.package]
version = "0.1.0-alpha.10"
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Single source of truth for the Deno/V8 stack and the shared basics. Most are
# used by more than one crate; deno_ast and deno_resolver are dev-mode-only but
# live here so the whole pinned stack bumps in one place.
# Declaring them here keeps the root crate and ssr_deno_dev_mode from drifting
# apart — they previously carried hand-copied version requirements. The Deno
# stack is pinned exactly (`=`) because its crates hard-pin each other
# internally; a caret requirement there resolves to a version the rest of the
# stack rejects.
[workspace.dependencies]
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = "=0.410.0"
deno_error = "=0.7.1"
deno_resolver = { version = "=0.88.0", features = ["deno_ast"] }
deno_runtime = { version = "=0.265.0", features = ["hmr"] }
deno_semver = "=0.10.1"
magnus = { version = "0.8", features = ["embed"] }
node_resolver = "=0.95.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys_traits = "=0.1.28"
tokio = { version = "1.53.1", features = ["full"] }

[package]
name = "ssr_deno"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["dev-mode"]
dev-mode = ["ssr_deno_dev_mode"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ssr_deno_core = { path = "crates/ssr_deno_core" }
ssr_deno_sys = { path = "crates/ssr_deno_sys" }
ssr_deno_dev_mode = { path = "crates/ssr_deno_dev_mode", optional = true }
magnus.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
deno_runtime.workspace = true
deno_core.workspace = true
deno_semver.workspace = true
deno_error.workspace = true
node_resolver.workspace = true
sys_traits.workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

# V8 and Deno's core crates rely on opt-level=3: the pre-built V8 static
# library is compiled at full optimization, and the Rust FFI/snapshot code
# behaves incorrectly at lower levels (panics, JIT failures, bad codegen).
[profile.dev.package.v8]
opt-level = 3

# deno_core 0.410 reaches V8 through this facade crate (aliases the `v8`
# package as `rusty_v8`) — the override above still matches the real `v8`
# package name, but the facade itself is new and needs its own override.
[profile.dev.package.deno_v8]
opt-level = 3

[profile.dev.package.deno_core]
opt-level = 3

[profile.dev.package.deno_runtime]
opt-level = 3

